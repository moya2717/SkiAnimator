<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkiAnimator Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header class="topbar">
        <div>
          <h1>SkiAnimator Dashboard</h1>
          <p id="meta"></p>
        </div>
        <div class="actions">
          <button id="connectBtn">Connect Strava</button>
          <button id="disconnectBtn">Disconnect</button>
        </div>
      </header>

      <p id="connectionStatus" class="status"></p>

      <section class="filters card">
        <input id="searchInput" type="search" placeholder="Search alpine ski runs" />
        <select id="yearFilter">
          <option value="all">All years</option>
        </select>
        <select id="dayFilter">
          <option value="all">All days</option>
        </select>
        <select id="difficultyFilter">
          <option value="all">All run difficulties</option>
          <option value="green">Green</option>
          <option value="blue">Blue</option>
          <option value="black">Black</option>
        </select>
      </section>

      <section class="dashboard-grid">
        <article class="card">
          <h2>Run animation</h2>
          <canvas id="runCanvas" width="820" height="280"></canvas>
          <ul id="runsList" class="list"></ul>
        </article>

        <article class="card">
          <h2>Alpine ski activities</h2>
          <ul id="activitiesList" class="list"></ul>
        </article>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
